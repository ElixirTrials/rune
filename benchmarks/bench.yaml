# benchmarks/bench.yaml — single source of truth for all bench/probe/diag/HPO runs.
# No script should hardcode any of these values.

checkpoint_path: "s3://elixirtrials-949678234935-eu-west-2-artifacts/checkpoints/hypernet_hpo/checkpoint.pt"
model_id: "Qwen/Qwen3.5-9B"
adapter_scaling: 0.49
temperature: 0.3
max_tokens: 3072
repetition_penalty: 1.1
top_p: 0.9
top_k: 20
thinking_budget: 1024
max_phase_iterations: 10

bench:
  gen_max_tokens: 64
  gen_temperature: 0.01
  probe_max_tokens: 256
  diag_scaling_sweep: [0.0, 0.1, 0.25, 0.5, 1.0, 1.5, 2.0]
  probe_scaling_sweep: [0.1, 0.25, 0.5, 0.75, 1.0, 1.5]

hpo:
  n_trials: 30
  adapter_scaling:
    low: 0.1
    high: 1.0
    log: true
  temperature:
    low: 0.1
    high: 1.0
  max_tokens:
    low: 512
    high: 4096
    step: 256
  max_phase_iterations:
    low: 3
    high: 10
  continuation_scaling:
    low: 0.3
    high: 1.0
    log: true
  cont_max_tokens: 512
  no_repeat_ngram_size: 12
