# ElixirTrials standard local-dev stack: Postgres, Pub/Sub emulator, MLflow.
# Application services (api / ui / agents) are added by individual repos as
# they scaffold them — extend this file or use a docker-compose.override.yml.
#
# Run: make infra-up   (or: docker-compose -f infra/docker-compose.yml up -d)
services:
  db:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or environment}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  pubsub-emulator:
    image: 3apag/pubsub-emulator:latest
    ports:
      - "${PUBSUB_EMULATOR_PORT:-8432}:8432"
    environment:
      PUBSUB_PROJECT_ID: ${PUBSUB_PROJECT_ID:-default}
      PUBSUB_LISTEN_ADDRESS: "0.0.0.0:8432"
    volumes:
      - pubsub_data:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mlflow_data:
  pubsub_data:
