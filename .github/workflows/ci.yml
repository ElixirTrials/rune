name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  paths-filter:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            python:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'src/rune/**'

  lint-and-type-check:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: github.event_name == 'push' || needs.paths-filter.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Lint with ruff
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src/

  test:
    runs-on: ubuntu-latest
    needs: [paths-filter, lint-and-type-check]
    if: github.event_name == 'push' || needs.paths-filter.outputs.python == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest tests/unit/ tests/integration/ --cov=src/rune --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml

  docs-build:
    runs-on: ubuntu-latest
    needs: paths-filter
    if: github.event_name == 'push' || needs.paths-filter.outputs.docs == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync
      - name: Build documentation
        run: uv run mkdocs build -f mkdocs.yml
