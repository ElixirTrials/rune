[project]
name = "rune"
version = "0.1.0"
description = "Local-first coding agent with hypernetwork-generated LoRA adapters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph>=0.4.0",
    "xgrammar>=0.2.0",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "torch>=2.5.0",
    "safetensors>=0.4.0",
    "jinja2>=3.1.0",
    "typer>=0.15.0",
    "mlflow>=2.18.0",
    "optuna>=4.1.0",
    "optuna-integration[mlflow]>=4.1.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.2.0",
    "ctx-to-lora>=0.0.1",
    "einops>=0.8.0",
    "jaxtyping>=0.3.9",
    "datasets>=4.0.0",
    "boto3>=1.35.0",
    "pyyaml>=6.0",
    "langchain>=1.3.1",
    "json-repair>=0.60.1",
    "markdown-it-py>=4.2.0",
    "big-o>=0.11.0",
]

[project.optional-dependencies]
gpu = [
    "bitsandbytes>=0.45.0; sys_platform == 'linux'",
    "trl>=0.16.0; sys_platform == 'linux'",
    "flash-attn>=2.8.0; sys_platform == 'linux'",
    "flash-attn-3>=3.0.0; sys_platform == 'linux'",
    # Mamba-block fast kernels for Qwen3.5's hybrid linear-attn layers.
    # Without these, the model falls back to the slow torch implementation
    # that's 2-5× slower for inference (matters a lot for benchmarking).
    # These compile from source against our cu130 torch — see
    # ``no-build-isolation-package`` below for the build-environment fix.
    "causal-conv1d>=1.6.0; sys_platform == 'linux'",
    "flash-linear-attention>=0.1.0; sys_platform == 'linux'",
]
[project.scripts]
rune = "rune.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "types-PyYAML>=6.0",
    "ruff>=0.14.0",
    "mkdocs>=1.6.0",
    "mkdocstrings[python]>=0.27.0",
    "pre-commit>=4.6.0",
    "ggshield>=1.10.8",
    "deepchecks>=0.19.1",
]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'linux'",
]
no-build-isolation-package = [
    "causal-conv1d",
    "flash-linear-attention",
]

[tool.uv.extra-build-dependencies]
causal-conv1d = ["setuptools"]
flash-linear-attention = ["setuptools"]

[tool.uv.sources]
ctx-to-lora = { git = "https://github.com/SakanaAI/doc-to-lora.git" }
flash-attn = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.17/flash_attn-2.8.3+cu130torch2.12-cp312-cp312-linux_x86_64.whl" }
flash-attn-3 = { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.18/flash_attn_3-3.0.0+cu130torch2.12gite2743ab-cp39-abi3-linux_x86_64.whl" }

[[tool.uv.dependency-metadata]]
name = "ctx-to-lora"
version = "0.0.1"
requires-dist = []

[tool.mypy]
exclude = "^(site|tests|tools)/"
strict = true

[[tool.mypy.overrides]]
module = [
    "langgraph", "langgraph.*",
    "langchain_core", "langchain_core.*",
    "big_o", "big_o.*",
    "xgrammar", "xgrammar.*",
    "peft", "peft.*",
    "torch", "torch.*",
    "transformers", "transformers.*",
    "safetensors", "safetensors.*",
    "datasets", "datasets.*",
    "mlflow", "mlflow.*",
    "optuna", "optuna.*",
    "optuna_integration", "optuna_integration.*",
    "bitsandbytes", "bitsandbytes.*",
    "ctx_to_lora", "ctx_to_lora.*",
    "trl", "trl.*",
    "model_training", "model_training.*",
    "adapter_registry", "adapter_registry.*",
    "flash_attn", "flash_attn.*",
    "apache_tvm_ffi", "apache_tvm_ffi.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rune.training.diff_loss",
    "rune.training.config",
    "rune.training.oracle_cache",
    "rune.model.hypernetwork",
    "rune.model.inference",
    "rune.model.wrapper",
]
disable_error_code = ["no-any-return", "misc", "unused-ignore", "import-untyped", "attr-defined", "index", "has-type", "arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["site", "docs", ".venv", "venv", ".git"]
markers = [
    "gpu: requires GPU (deselect with '-m \"not gpu\"')",
]
filterwarnings = [
    "ignore:unclosed database:ResourceWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/rune"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC", "PLE", "PLW"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/rune/training/diff_loss.py" = ["PLC0415", "PLW0603", "B905"]
"src/rune/model/*.py" = ["PLC0415"]
"tests/**" = ["E501"]
# Research / remove-before-merge probe scripts: line length not enforced
# (consolidates the explicit per-tool E501 entries below).
"tools/*.py" = ["E501"]
"tools/diag_synthetic_overfit.py" = ["E501"]
"tools/diag_traj_sensitivity.py" = ["E501"]
"tools/diag_forced_choice.py" = ["E501"]
"tools/diag_pre_corpus_gate.py" = ["E501"]
"tools/gate_trajectory.py" = ["E501", "E702", "PLC0415"]
"tools/diag_weight_sensitivity.py" = ["E501", "E702", "PLC0415"]
"tools/diag_conditioning.py" = ["E501", "E702", "PLC0415"]
"tools/diag_recall.py" = ["E501", "E702", "PLC0415"]
"tools/diag_qa_recall.py" = ["E501", "E702", "PLC0415"]
"tools/diag_recoverability.py" = ["E501", "E702", "PLC0415"]
"tools/diag_teacher_quality.py" = ["E501"]
"tools/run_corpus_distill.py" = ["E501"]
"tools/split_corpus.py" = ["E501"]
"tools/deepchecks_corpus.py" = ["E501"]
"tools/corpus_split_qc.py" = ["E501"]
"tools/bench_loss_mem.py" = ["E501"]
"tools/diag_corpus_gate.py" = ["E501", "PLC0415"]
"tools/diag_specificity.py" = ["E501", "PLC0415"]
"tools/hpo_train.py" = ["E501"]
