[project]
name = "rune"
version = "0.1.0"
description = "Local-first coding agent with hypernetwork-generated LoRA adapters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.0",
    "outlines>=0.2.0",
    "transformers>=4.48.0",
    "peft>=0.14.0",
    "torch>=2.5.0",
    "safetensors>=0.4.0",
    "tree-sitter>=0.24.0",
    "tree-sitter-python>=0.23.0",
    "jinja2>=3.1.0",
    "typer>=0.15.0",
    "mlflow>=2.18.0",
    "optuna>=4.1.0",
    "optuna-integration[mlflow]>=4.1.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.2.0",
    "bitsandbytes>=0.45.0",
]

[project.scripts]
rune = "rune.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
]

[tool.uv]
package = true

[tool.uv.sources]

[tool.mypy]
exclude = "^(site|tests)/"
strict = true

[[tool.mypy.overrides]]
module = [
    "langgraph", "langgraph.*",
    "langchain_core", "langchain_core.*",
    "outlines", "outlines.*",
    "peft", "peft.*",
    "torch", "torch.*",
    "transformers", "transformers.*",
    "safetensors", "safetensors.*",
    "tree_sitter", "tree_sitter.*",
    "tree_sitter_python", "tree_sitter_python.*",
    "mlflow", "mlflow.*",
    "optuna", "optuna.*",
    "optuna_integration", "optuna_integration.*",
    "bitsandbytes", "bitsandbytes.*",
    "ctx_to_lora", "ctx_to_lora.*",
    "trl", "trl.*",
    "model_training", "model_training.*",
    "adapter_registry", "adapter_registry.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "rune.training.diff_loss",
    "rune.training.config",
    "rune.training.oracle_cache",
    "rune.model.hypernetwork",
    "rune.model.inference",
]
disable_error_code = ["no-any-return", "misc", "unused-ignore", "import-untyped", "attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["site", "docs", ".venv", "venv", ".git"]
markers = [
    "gpu: requires GPU (deselect with '-m \"not gpu\"')",
]
filterwarnings = [
    "ignore:unclosed database:ResourceWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/rune"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PLC", "PLE", "PLW"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/rune/training/diff_loss.py" = ["PLC0415", "PLW0603", "B905"]
"src/rune/model/*.py" = ["PLC0415"]
"tests/**" = ["E501"]
