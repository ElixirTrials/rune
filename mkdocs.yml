site_name: Rune
site_description: Local-first coding agent with hypernetwork-generated LoRA adapters
repo_url: https://github.com/elixir-trials/rune

validation:
  nav:
    omitted_files: ignore

theme:
  name: readthedocs

nav:
  - Home: index.md
  - Architecture:
      - Engine: architecture/engine.md
      - Model: architecture/model.md
      - Training: architecture/training.md
  - API Reference:
      - Engine:
          - State: api/engine/state.md
          - Graph: api/engine/graph.md
          - Policy: api/engine/policy.md
          - Parse: api/engine/parse.md
          - Continuation: api/engine/continuation.md
      - Model:
          - Wrapper: api/model/wrapper.md
          - Inference: api/model/inference.md
          - Hypernetwork: api/model/hypernetwork.md
          - Adapter: api/model/adapter.md
      - Training:
          - Orchestrator: api/training/orchestrator.md
          - HyperLoRA Distillation: api/training/hypernet_distill.md
          - Collapse Metrics: api/training/collapse_metrics.md
          - Gate: api/training/gate.md
          - D2L Train Config: api/training/d2l_train.md
      - Benchmark:
          - Runner: api/benchmark.md
          - HPO: api/bench/hpo.md
      - Mining: api/mining.md
      - Tracking: api/tracking.md
      - Config: api/config.md
      - Registry: api/registry.md
      - Sandbox: api/sandbox.md
      - CLI: api/cli.md
  - Paper & Experiments:
      - "Paper Evidence Map (paper_v9)": paper-evidence-map-2026-06-09.md
      - "MLflow Experiment Inventory": mlflow-experiment-inventory-2026-06-09.md
      - "Issue #52 Experimentation Log": issue52-experimentation-log.md
      - "Results Section Guide": issue52-results-section-guide.md
      - "Long-Context Results (adapter vs context)": issue52-results-longcontext-2026-06-22.md
      - "LCB Durable Findings": issue52-lcb-durable-findings-2026-06-19.md
      - "LCB Failure Modes (C4/I0 run)": issue52-lcb-failure-modes-2026-07-08.md
      - "LCB Remediation (2026-07-09)": issue52-lcb-remediation-2026-07-09.md
      - "RepoBench Clamp Findings": issue52-repobench-clamp-findings-2026-06-22.md
      - "RepoBench Template HPO": issue52-repobench-template-hpo-findings-2026-06-22.md
      - "HumanEval+ Regression RCA": issue52-humaneval-regression-rca-fix-2026-06-22.md
      - "Goal-3 Conclusions": issue52-goal3-conclusions-2026-06-05.md
      - Publication (TMLR):
          - "Realized Gates (consolidated handoff)": publication/handoff_realized_gates.md
          - "C1 Keystone Findings": publication/c1_keystone_findings.md
          - "C3.2 W-Sweep Findings": publication/c32_wsweep_findings.md
          - "C2.1 Fresh-Pool Re-estimate Prep": publication/c21_prep.md
          - "C0.1 Corpus-Trajectory Lookup": publication/c01_corpus_lookup.md
          - "Code-Side Task Plan": publication/publication_task_plan.md
          - "Remediation Plan": publication/remediation_plan_FINAL.md
          - "Adversary Review of Plan": publication/adversary_review.md
          - "v13 Review Handoff": publication/HANDOFF_v13_review.md
  - Design Notes:
      - "Issue #49 D2L Retrain": superpowers/specs/2026-05-30-issue49-d2l-self-distillation-retrain-design.md
      - Episodic Conditioning Design: superpowers/specs/2026-06-05-episodic-conditioning-design.md
      - Rune v2 Simplification Design: superpowers/specs/2026-05-21-rune-v2-simplification-design.md
      - Adapter Continuation Design: superpowers/specs/2026-05-26-adapter-continuation-design.md
      - Engine v2 Design: superpowers/specs/2026-05-26-engine-v2-design.md
      - PEFT Scaling Fix Design: superpowers/specs/2026-05-26-peft-scaling-fix-design.md
      - Rune v2 Implementation Plan: superpowers/plans/2026-05-22-rune-v2-implementation.md
      - Engine v2 Plan: superpowers/plans/2026-05-26-engine-v2.md
      - "Cross-file Context Adapter Benchmark Design": superpowers/specs/2026-06-22-crossfile-context-adapter-benchmark-design.md
      - "Powered Strict-Superset Eval Design": superpowers/specs/2026-06-22-powered-strict-superset-eval-design.md
      - "Powered Strict-Superset Eval Plan": superpowers/plans/2026-06-22-powered-strict-superset-eval.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            members_order: source

markdown_extensions:
  - admonition
  - fenced_code
  - tables
  - toc:
      permalink: true
